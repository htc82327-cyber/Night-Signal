name: Build Night Signal DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f control
          test -f Tweak.xm
          test -f NightSignalTweak.plist
          test -f NightSignal/Makefile
          test -f PovoZka/Makefile
          echo "Project structure OK"

      - name: Install Linux dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            unzip \
            git \
            libxml2 \
            libtinfo6 \
            xz-utils \
            ca-certificates \
            file

      - name: Install Theos
        run: |
          set -euxo pipefail

          rm -rf "$THEOS"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

          mkdir -p "$THEOS/toolchain"
          mkdir -p "$THEOS/sdks"

          echo "THEOS=$THEOS"
          ls -la "$THEOS"

      - name: Install iOS Linux toolchain
        run: |
          set -euxo pipefail

          curl -fL \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/ios-toolchain.tar.xz

          tar -xJf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"

          echo "Toolchain contents:"
          find "$THEOS/toolchain" -maxdepth 4 -type f -name clang -o -name ld | head -30

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -euxo pipefail

          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"

          echo "Installed SDKs:"
          ls -lah "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Show Theos environment
        run: |
          set -euxo pipefail
          echo "THEOS=$THEOS"
          echo "SDKs:"
          ls -1 "$THEOS/sdks"
          echo "Toolchain:"
          ls -lah "$THEOS/toolchain/linux/iphone/bin" | head -40

      - name: Build rootless arm64 package
        run: |
          set -euxo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET=iphone:clang:16.5:15.0

      - name: Show generated packages
        if: always()
        run: |
          echo "packages/:"
          ls -lah packages/ || true
          echo ".theos/:"
          find .theos -maxdepth 3 -type f 2>/dev/null | head -100 || true

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightSignal-PovoZka-DEB
          path: packages/*.deb
          if-no-files-found: error
